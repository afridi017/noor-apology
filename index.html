Kal raat ke liye dil se maafi.

Main sheher gaya tha, late aya. Thakan thi, lekin dil mein ek hi khayal — tumhari chat kholi, bas ek message ka intezar karte karte... phone dekhte dekhte so gaya.

I know you waited. Your gila is valid.

Some things need morning. Some need distance. Some just need sleep.

You carry the whole house on your shoulders, let me carry your worries for a while.

You bring light to my world, even when yours feels dark. And I mean that. Noor means light, and you live it — quietly, without asking for credit.

Distance means so little when someone means so much. 4500km is just a number. Your silence last night felt heavier than any distance.

You are not your mistakes. You are the love you give.

Main hoon na. Always, in your corner. Not to fix everything, but to sit beside you when everything feels too much.

I can't hug you right now, so I'm sending you these words to hold you.
